[auth.email.template.recovery]
subject = "Reset your Travel Handbook password"
content_path = "./supabase/templates/recovery.html"

[functions.check-user-email]
verify_jwt = false

# Travel intelligence. These call billed third-party providers on the user's
# behalf, so unlike the recovery lookup they require a signed-in caller.
[functions.travel-capabilities]
verify_jwt = true

[functions.travel-discover]
verify_jwt = true

[functions.travel-route-matrix]
verify_jwt = true

[functions.travel-evidence]
verify_jwt = true

# The nightly refresh is called by a scheduler, not a signed-in traveller, so
# it authenticates itself with TRAVEL_REFRESH_SECRET instead of a JWT. It
# refuses every request when that secret is unset — an endpoint that spends
# quota must fail closed.
[functions.travel-refresh]
verify_jwt = false

[functions.travel-weather]
verify_jwt = true

[functions.travel-events]
verify_jwt = true

[functions.travel-import-link]
verify_jwt = true

[functions.travel-reasoning]
verify_jwt = true

[functions.planitenary-agent]
verify_jwt = true
