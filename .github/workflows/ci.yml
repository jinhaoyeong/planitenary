name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npx tsc -b

      - name: Production build
        run: npm run build
